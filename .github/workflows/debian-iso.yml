name: Debian - ISO e testes

# Constrói a ISO do Akko's OS (edição Debian) com o live-build num container
# Debian 13 e testa no QEMU/KVM: boot funcional com verificação de cada módulo,
# boot pelo GRUB em UEFI, UEFI com Secure Boot e BIOS.
# As evidências (prints, logs, resultado.json) vão para o branch
# "evidencias-debian"; a ISO fica nos artefatos da execução.

on:
  push:
    branches: [main, edicao-debian]
    paths:
      - "editions/debian/**"
      - "branding/**"
      - "tests/debian/**"
      - ".github/workflows/debian-iso.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apps:
    name: Programas gráficos (teste rápido)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Abrir cada programa num Debian 13 com tela virtual
        run: |
          mkdir -p "$RUNNER_TEMP/fumaca" && chmod 777 "$RUNNER_TEMP/fumaca"
          sed -i "s/\r$//" tests/debian/fumaca_apps.sh
          scripts/ci-run.sh "Programas gráficos" --notice 20 \
            docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/fumaca:/saida" debian:trixie \
              bash /repo/tests/debian/fumaca_apps.sh /saida

      - name: Publicar prints (branch evidencias-apps)
        if: always()
        run: |
          E=$(mktemp -d); cd "$E"
          git init -q && git checkout -q -b evidencias-apps
          mkdir ev && cp "$RUNNER_TEMP"/fumaca/*.png "$RUNNER_TEMP"/fumaca/*.log ev/ 2>/dev/null || true
          printf 'run %s, commit %s\n' "${{ github.run_id }}" "${{ github.sha }}" > ev/LEIA.txt
          git add ev && git -c user.name=akkos-ci -c user.email=akkos-ci@users.noreply.github.com commit -qm "Prints dos programas: run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" evidencias-apps

  iso:
    name: Construir e testar
    needs: apps
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null || true
          W=$( [ -d /mnt ] && sudo mountpoint -q /mnt && echo /mnt/akkos || echo "$RUNNER_TEMP/akkos" )
          sudo mkdir -p "$W" && sudo chown "$(id -u):$(id -g)" "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "AKKOS_VERSAO=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_ENV"
          df -h / "$W"

      - name: Construir a ISO (live-build em Debian 13)
        run: |
          scripts/ci-run.sh "Build da ISO Debian" --notice 30 \
            docker run --rm --privileged \
              -v "$PWD:/repo:ro" -v "$W:/trabalho" \
              -e AKKOS_VERSAO -e AKKOS_TRAB=/trabalho/lb -e AKKOS_SAIDA=/trabalho/saida \
              debian:trixie bash -c '
                set -e
                sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
                cp -r /repo /tmp/repo
                /tmp/repo/editions/debian/build_os.sh
                chown -R '"$(id -u):$(id -g)"' /trabalho/saida
              '
          ls -la "$W/saida"

      - name: Resumo do build
        if: always()
        run: |
          L="$W/saida/build.log"
          [ -f "$L" ] || exit 0
          # avisos e erros do live-build e dos hooks, sem o ruído do apt
          grep -n -E '\[akkos|E: |ERRO|Error|error:|W: |falhou' "$L" | grep -v -E 'libgpg-error|liberror|error-perl' | tail -60 > resumo.txt || true
          echo "::notice title=Resumo do build::$(tail -c 3500 resumo.txt | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Preparar QEMU e OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf xorriso python3-pil
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm /usr/share/OVMF/

      - name: Testar no QEMU
        run: |
          iso=$(ls "$W"/saida/*.iso | head -1)
          scripts/ci-run.sh "Teste da ISO Debian" python3 tests/debian/teste_iso.py "$iso" "$W/evidencias"

      - name: Resumo dos testes
        if: always()
        run: |
          f="$W/evidencias/resultado.json"
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          esc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          linhas = [f"{'OK ' if v['ok'] else 'FALHOU'} {k}: {v['detalhe'][:110]}" for k, v in {**r['etapas'], **r['verificacoes']}.items()]
          if r.get("faltando"):
              linhas.append("FALTANDO: " + ", ".join(r["faltando"]))
          nivel = "notice" if r.get("sucesso") else "error"
          texto = "\n".join(linhas)
          for i in range(0, len(texto), 3800):
              print(f"::{nivel} title=Testes da ISO Debian ({i // 3800 + 1})::{esc(texto[i:i + 3800])}")
          PY

      - name: Publicar evidências (branch evidencias-debian)
        if: always()
        run: |
          [ -d "$W/evidencias" ] || exit 0
          E=$(mktemp -d)
          cd "$E"
          git init -q && git checkout -q -b evidencias-debian
          mkdir -p ev
          cp "$W"/evidencias/*.png "$W"/evidencias/*.log "$W"/evidencias/*.json ev/ 2>/dev/null || true
          cp "$W"/saida/*.sha256 ev/ 2>/dev/null || true
          [ -f "$W/saida/build.log" ] && tail -c 400000 "$W/saida/build.log" > ev/build-final.log
          ls "$W"/saida/*-pacotes.txt >/dev/null 2>&1 && cp "$W"/saida/*-pacotes.txt ev/pacotes.txt
          printf 'run %s, commit %s, %s\n' "${{ github.run_id }}" "${{ github.sha }}" "$(date -u)" > ev/LEIA.txt
          git add ev && git -c user.name=akkos-ci -c user.email=akkos-ci@users.noreply.github.com commit -qm "Evidências: run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" evidencias-debian

      - name: Enviar a ISO
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akkos-debian-iso
          path: |
            ${{ env.W }}/saida/*.iso
            ${{ env.W }}/saida/*.sha256
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
