name: Sonda Debian (temporária)
on:
  push:
    branches: [sonda-debian]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Coletar informações dentro do Debian 13
        run: |
          mkdir -p saida
          docker run --rm -v "$PWD/saida:/saida" debian:trixie bash -c '
            sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            apt-get install -y -qq live-build openbox firejail-profiles dxvk live-config plymouth plymouth-themes grub-common fonts-dejavu-core lightdm >/dev/null 2>&1
            { echo "### dxvk-setup"; cat /usr/bin/dxvk-setup; echo; echo "### README.Debian"; zcat -f /usr/share/doc/dxvk/README.Debian*; } > /saida/dxvk-setup.txt 2>&1
            { echo "### wine.profile"; cat /etc/firejail/wine.profile; echo "### chromium.profile"; cat /etc/firejail/chromium.profile; echo "### chromium-common.profile"; cat /etc/firejail/chromium-common.profile; } > /saida/firejail-perfis.txt 2>&1
            cp /etc/xdg/openbox/rc.xml /saida/openbox-rc.xml; cp /etc/xdg/openbox/menu.xml /saida/openbox-menu.xml
            ls /usr/lib/live/config/ > /saida/live-config-componentes.txt; for f in /usr/lib/live/config/*lightdm* /usr/lib/live/config/*user-setup* /usr/lib/live/config/*login* ; do echo "##### $f"; cat "$f"; done >> /saida/live-config-componentes.txt 2>&1
            lb config --help > /saida/lb-config-help.txt 2>&1; man -P cat lb_config > /saida/lb-config-man.txt 2>&1 || zcat /usr/share/man/man1/lb_config.1.gz > /saida/lb-config-man.txt
            find / -path /proc -prune -o -name "script.so" -print 2>/dev/null | grep plymouth > /saida/plymouth.txt; ls /usr/share/plymouth/themes >> /saida/plymouth.txt; cat /usr/share/plymouth/themes/script/script.plymouth >> /saida/plymouth.txt 2>&1
            for s in 14 16 20 24; do grub-mkfont -s $s -o /tmp/f$s.pf2 /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; grub-mkfont -s $s -o /tmp/b$s.pf2 /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; done
            for f in /tmp/f20.pf2 /tmp/b24.pf2; do echo "$f: $(head -c 200 $f | tr -c "[:print:]" " ")"; done > /saida/grub-fontes.txt
            cat /usr/share/live/build/functions/defaults.sh 2>/dev/null | grep -n -i -E "bootloader|secure" | head -40 > /saida/lb-defaults.txt
            grep -rn -i "BOOTLOADERS" /usr/lib/live/build/binary_grub_cfg | head -20 >> /saida/lb-defaults.txt
            grep -rn -E "APPEND_LIVE|KERNEL_LIVE|LINUX_LIVE" /usr/lib/live/build/binary_grub_cfg | head -30 >> /saida/lb-defaults.txt
          '
          ls -la saida
      - name: Publicar no branch sonda-saida
        run: |
          git config user.name "akkos-ci"; git config user.email "akkos-ci@users.noreply.github.com"
          git checkout --orphan sonda-saida
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name saida ! -name .git -exec rm -rf {} +
          git add saida && git commit -qm "Sonda Debian: $(date -u)" && git push -f origin sonda-saida
