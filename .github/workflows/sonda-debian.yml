name: Sonda Debian (temporária)
on:
  push:
    branches: [sonda-debian]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Coletar informações dentro do Debian 13
        run: |
          mkdir -p saida
          docker run --rm -v "$PWD/saida:/saida" debian:trixie bash -c '
            cat > /etc/apt/sources.list.d/debian.sources <<EOT
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates trixie-backports
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOT
            dpkg --add-architecture i386
            apt-get update -qq
            P="linux-image-amd64 linux-headers-amd64 nvidia-driver nvidia-kernel-dkms nvidia-open-kernel-dkms nvidia-tesla-470-driver nvidia-driver-libs nvidia-vulkan-icd firmware-nvidia-gsp firmware-amd-graphics firmware-intel-graphics firmware-misc-nonfree mesa-vulkan-drivers libgl1-mesa-dri intel-media-va-driver-non-free mesa-va-drivers calamares calamares-settings-debian python3-psutil nvidia-detect vulkan-tools mesa-utils xserver-xorg-video-nvidia nvidia-settings libnvidia-gl i965-va-driver"
            for p in $P; do echo "## $p"; apt-cache policy $p | sed -n "2,3p;/trixie/p" | head -8; done > /saida/versoes.txt 2>&1
            apt-cache policy "nvidia-driver:i386" "nvidia-driver-libs:i386" >> /saida/versoes.txt
            apt-cache search --names-only "^nvidia" | sort > /saida/nvidia-pacotes.txt
            apt-cache search --names-only "^linux-image-[0-9]" | sort > /saida/kernels.txt
            apt-get install -y -qq calamares calamares-settings-debian >/dev/null 2>&1
            { find /etc/calamares /usr/share/calamares -type f | sort; for f in /etc/calamares/settings.conf /etc/calamares/branding/*/branding.desc /etc/calamares/modules/*.conf; do echo "##### $f"; cat "$f"; done; ls /usr/lib/calamares/modules 2>/dev/null; ls /usr/lib/x86_64-linux-gnu/calamares/modules; dpkg -L calamares-settings-debian; } > /saida/calamares.txt 2>&1
            apt-get install -y -qq -t trixie-backports nvidia-kernel-dkms linux-headers-amd64 >/dev/null 2>&1; echo "rc=$?" > /saida/nvidia-bpo.txt; dkms status >> /saida/nvidia-bpo.txt 2>&1
          '
          ls -la saida
      - name: Publicar no branch sonda-saida
        run: |
          git config user.name "akkos-ci"; git config user.email "akkos-ci@users.noreply.github.com"
          git checkout --orphan sonda-saida
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name saida ! -name .git -exec rm -rf {} +
          git add saida && git commit -qm "Sonda Debian: $(date -u)" && git push -f origin sonda-saida
