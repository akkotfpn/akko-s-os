name: Sonda Debian (temporária)
on:
  push:
    branches: [sonda-debian]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Coletar informações dentro do Debian 13
        run: |
          mkdir -p saida
          docker run --rm -v "$PWD/saida:/saida" debian:trixie bash -c '
            cat > /etc/apt/sources.list.d/debian.sources <<EOT
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates trixie-backports
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOT
            dpkg --add-architecture i386
            apt-get update -qq
            for p in linux-image-amd64 linux-headers-amd64 nvidia-driver nvidia-kernel-dkms nvidia-open-kernel-dkms firmware-nvidia-gsp mesa-vulkan-drivers libgl1-mesa-dri firmware-amd-graphics firmware-intel-graphics firmware-misc-nonfree xe-firmware intel-microcode amd64-microcode; do echo "## $p"; apt-cache madison $p | sed -n "1,4p"; done > /saida/madison.txt 2>&1
            apt-get install -y -qq -t trixie-backports linux-image-amd64 linux-headers-amd64 > /saida/kernel-bpo.txt 2>&1; echo "rc=$?" >> /saida/kernel-bpo.txt; ls /lib/modules /usr/src >> /saida/kernel-bpo.txt
            apt-get install -y -qq nvidia-kernel-dkms > /saida/nv-stable.txt 2>&1; echo "rc=$?" >> /saida/nv-stable.txt; dkms status >> /saida/nv-stable.txt 2>&1; tail -40 /var/lib/dkms/nvidia-current/*/build/make.log >> /saida/nv-stable.txt 2>&1
            apt-get install -y -qq -t trixie-backports nvidia-kernel-dkms > /saida/nv-bpo.txt 2>&1; echo "rc=$?" >> /saida/nv-bpo.txt; dkms status >> /saida/nv-bpo.txt 2>&1; tail -30 /var/lib/dkms/nvidia-current/*/build/make.log >> /saida/nv-bpo.txt 2>&1
          '
          ls -la saida
      - name: Publicar no branch sonda-saida
        run: |
          git config user.name "akkos-ci"; git config user.email "akkos-ci@users.noreply.github.com"
          git checkout --orphan sonda-saida
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name saida ! -name .git -exec rm -rf {} +
          git add saida && git commit -qm "Sonda Debian: $(date -u)" && git push -f origin sonda-saida
