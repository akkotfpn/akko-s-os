# Akko's OS — vídeo, fontes, tema e textos do menu do GRUB.
#
# Tenta sempre o modo gráfico (tema com a marca, acentos certos). Se a
# máquina não tiver nenhum modo de vídeo que o GRUB consiga usar (algumas
# VMs com tela serial, placas antigas), cai no modo texto, que não desenha
# acentos: nesse caso os textos do menu vêm sem acento em vez de "?".
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi
insmod video_bochs
insmod video_cirrus

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi
loadfont $font
loadfont /boot/grub/live-theme/akkos-regular-16.pf2
loadfont /boot/grub/live-theme/akkos-regular-20.pf2
loadfont /boot/grub/live-theme/akkos-bold-20.pf2

set gfxmode=1920x1080,1600x900,1280x720,1024x768,800x600,auto
set gfxpayload=keep

set akkos_grafico=0
if terminal_output gfxterm; then
    set akkos_grafico=1
else
    terminal_output console
fi

if [ "$akkos_grafico" = 1 ]; then
    source /boot/grub/theme.cfg
    set t_usar="Usar o Akko's OS sem instalar"
    set t_guardar="Usar sem instalar, guardando as alterações"
    set t_instalar="Instalar o Akko's OS no computador"
    set t_video="Modo de vídeo seguro (se a tela ficar preta)"
    set t_ram="Carregar tudo na memória (mais rápido, tira o pendrive)"
    set t_util="Utilitários…"
    set t_verificar="Verificar a integridade da mídia"
    set t_firmware="Configurações do firmware (UEFI)"
    set t_reiniciar="Reiniciar"
    set t_desligar="Desligar"
else
    set color_normal=light-gray/black
    set color_highlight=white/red
    set menu_color_normal=light-gray/black
    set menu_color_highlight=white/red
    set t_usar="Usar o Akko's OS sem instalar"
    set t_guardar="Usar sem instalar, guardando as alteracoes"
    set t_instalar="Instalar o Akko's OS no computador"
    set t_video="Modo de video seguro (se a tela ficar preta)"
    set t_ram="Carregar tudo na memoria (mais rapido, tira o pendrive)"
    set t_util="Utilitarios..."
    set t_verificar="Verificar a integridade da midia"
    set t_firmware="Configuracoes do firmware (UEFI)"
    set t_reiniciar="Reiniciar"
    set t_desligar="Desligar"
fi
