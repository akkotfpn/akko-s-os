# Akko's OS — vídeo, fontes e tema do GRUB
set default=0
set timeout=8
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1920x1080,1280x720,1024x768,auto
    set gfxpayload=keep
    if [ "${grub_platform}" = "efi" ]; then
        insmod efi_gop
        insmod efi_uga
    else
        insmod vbe
    fi
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

loadfont /boot/grub/live-theme/akkos-regular-16.pf2
loadfont /boot/grub/live-theme/akkos-regular-20.pf2
loadfont /boot/grub/live-theme/akkos-bold-20.pf2

source /boot/grub/theme.cfg

terminal_output gfxterm
