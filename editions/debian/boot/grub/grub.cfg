# Akko's OS — menu de boot (GRUB 2, BIOS e UEFI).
# O live-build troca os marcadores @…@ pelos caminhos do kernel e parâmetros.
source /boot/grub/config.cfg

menuentry "Iniciar o Akko's OS" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Iniciar em modo de vídeo seguro" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "Iniciar carregando tudo na memória" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

submenu "Utilitários…" --hotkey=u {
	source /boot/grub/theme.cfg

	menuentry "Verificar a integridade da mídia" --hotkey=v {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Configurações do firmware (UEFI)" --hotkey=f {
			fwsetup
		}
	fi
	menuentry "Reiniciar" {
		reboot
	}
	menuentry "Desligar" {
		halt
	}
}
