# Akko's OS — menu de boot (GRUB 2, BIOS e UEFI).
# O live-build troca os marcadores @…@ pelos caminhos do kernel e parâmetros.
# Os textos ficam em config.cfg (com e sem acento, conforme o modo de vídeo).
source /boot/grub/config.cfg

menuentry "${t_usar}" --hotkey=u {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "${t_guardar}" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-label=akkos-dados
	initrd	@INITRD_LIVE@
}

menuentry "${t_instalar}" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ akkos.instalar=1
	initrd	@INITRD_LIVE@
}

menuentry "${t_video}" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "${t_ram}" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

submenu "${t_util}" --hotkey=t {
	if [ "$akkos_grafico" = 1 ]; then source /boot/grub/theme.cfg; fi

	menuentry "${t_verificar}" --hotkey=v {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "${t_firmware}" --hotkey=f {
			fwsetup
		}
	fi
	menuentry "${t_reiniciar}" {
		reboot
	}
	menuentry "${t_desligar}" {
		halt
	}
}
