# Akko's OS — saídas de áudio: não suspende a placa em 5 s (evita o "clique"
# e o atraso no primeiro som depois de silêncio, como o clique do mouse)
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
