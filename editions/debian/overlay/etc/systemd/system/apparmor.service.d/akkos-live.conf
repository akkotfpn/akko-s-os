# Akko's OS: carrega os perfis do AppArmor também no sistema live (rodando
# da ISO/pendrive). O Debian pula o serviço quando a raiz é o overlay do
# live-boot; como o Akko's OS roda principalmente assim, sem esta linha a
# sandbox do navegador e do Wine ficaria sem AppArmor.
# (Uma linha vazia apaga a condição ConditionPathExists do serviço original.)
[Unit]
ConditionPathExists=
