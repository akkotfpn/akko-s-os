# Akko's OS: sessão padrão e entrada automática no sistema live.
# O usuário do sistema live (akko) é criado pelo live-config no boot, que
# também liga o autologin no /etc/lightdm/lightdm.conf.
[Seat:*]
user-session=akkos
autologin-session=akkos
greeter-session=lightdm-gtk-greeter
greeter-hide-users=false
