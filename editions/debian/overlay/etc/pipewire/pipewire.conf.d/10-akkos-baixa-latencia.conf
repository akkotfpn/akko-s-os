# Akko's OS — PipeWire em baixa latência.
# 256 amostras a 48 kHz ≈ 5,3 ms por ciclo (o padrão do PipeWire é 1024 ≈ 21 ms).
# Aplicativos podem pedir até 64 (≈1,3 ms) quando precisarem (jogos, música).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 2048
}
